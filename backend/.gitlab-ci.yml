image: 
  name: sonarsource/sonar-scanner-cli:11
  entrypoint: [""]

variables:
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Defines the location of the analysis task cache
  GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the analysis task

stages:
  - test
  - build-sonar
  - build

check_ci_changes:
  stage: test
  image:
    name: alpine:3.22
    pull_policy: if-not-present

  script:
    - apk add --no-cache git
    - git fetch origin main
    - if git diff --name-only origin/main...HEAD | grep -q ".gitlab-ci.yml"; then
      echo ".gitlab-ci.yml was modified in this branch.";
      else
      echo ".gitlab-ci.yml was NOT modified.";
      fi

  allow_failure: true
  only:
    - merge_requests
    - branches
  except:
    - main

build:
  stage: build
  image:
    name: docker:28.5.1-cli-alpine3.22
    pull_policy: if-not-present

  variables:
    IMAGE_NAME: "$CI_REGISTRY_IMAGE"
    IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
    BRANCH_TAG: "${CI_COMMIT_REF_NAME}"

  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"

  script:
    - docker build -t "$IMAGE_NAME:$IMAGE_TAG" -f Dockerfile .
    - |
      SANITIZED_BRANCH=$(echo "$BRANCH_TAG" | tr '/' '-')
      if [[ "$CI_COMMIT_REF_NAME" != "main" && "$CI_COMMIT_REF_NAME" != "dev" ]]; then
        exit 0
      fi
      docker push "$IMAGE_NAME:$IMAGE_TAG"
      docker tag "$IMAGE_NAME:$IMAGE_TAG" "$IMAGE_NAME:$SANITIZED_BRANCH"
      docker push "$IMAGE_NAME:$SANITIZED_BRANCH"

  only:
    - main
    - dev
    - merge_requests


build-sonar:
  stage: build-sonar
  
  
  cache:
    policy: pull-push
    key: "sonar-cache-$CI_COMMIT_REF_SLUG"
    paths:
      - "${SONAR_USER_HOME}/cache"
      - sonar-scanner/
      
  script: 
  - sonar-scanner -Dsonar.host.url="${SONAR_HOST_URL}"
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == 'master'
    - if: $CI_COMMIT_BRANCH == 'main'
    - if: $CI_COMMIT_BRANCH == 'dev'