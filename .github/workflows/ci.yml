# Runs on every push and pull request. Railway deploys `main` on its own; this
# reports whether the commit lints, type-checks, builds and passes the tests.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests
        run: bun run test
      - name: Build
        run: bun run build
        env:
          NUXT_PUBLIC_GRAPHQL_URL: https://onebrandingbackend.up.railway.app/graphql
      # Renders the built site against the live CMS (read-only GraphQL queries).
      - name: End-to-end
        run: bun run test:e2e

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        run: bun run build
        env:
          NODE_ENV: production
      # Boots Strapi on a throwaway SQLite database.
      - name: End-to-end (local uploads)
        run: bun run test:e2e
      - name: End-to-end (R2 URL rules)
        run: bun run test:e2e
        env:
          E2E_PROVIDER: r2
          R2_ACCESS_KEY_ID: dummy
          R2_SECRET_ACCESS_KEY: dummy
          R2_BUCKET: dummy
          R2_PUBLIC_URL: https://pub-test.r2.dev
          R2_ROOT_PATH: uploads
          R2_ACCOUNT_ID: dummy
